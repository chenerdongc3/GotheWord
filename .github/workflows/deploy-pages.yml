name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      NEXT_PUBLIC_SUPABASE_MIGRATION: ${{ vars.SUPABASE_MIGRATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        run: |
          echo "NEXT_PUBLIC_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOYMENT_ENV=production" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITES_VERSION=github-pages-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Verify release metadata
        run: npm run release:verify

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate A1 content and generated runtime
        run: npm run content:a1:check

      - name: Test application
        run: npm test

      - name: Build and test GitHub Pages export
        run: npm run test:pages

      - name: Verify A1 source-list publication rights
        run: npm run content:a1:check-rights

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
