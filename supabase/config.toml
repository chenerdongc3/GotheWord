project_id = "gotheword"

[auth]
enabled = true
site_url = "env(GOTHEWORD_AUTH_SITE_URL)"
additional_redirect_urls = ["env(GOTHEWORD_AUTH_REDIRECT_URL)"]
enable_signup = true

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.smtp]
enabled = true
host = "env(GOTHEWORD_SMTP_HOST)"
port = 587
user = "env(GOTHEWORD_SMTP_USER)"
pass = "env(GOTHEWORD_SMTP_PASS)"
admin_email = "env(GOTHEWORD_SMTP_FROM)"
sender_name = "GotheWord"

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(GOTHEWORD_TURNSTILE_SECRET)"

[auth.email.template.confirmation]
subject = "GotheWord 邮箱验证码"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "GotheWord 密码重置验证码"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "GotheWord 邮箱变更验证码"
content_path = "./supabase/templates/email-change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "GotheWord 密码已修改"
content_path = "./supabase/templates/password-changed.html"
